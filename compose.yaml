name: annotation2

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # Must list the exact origin in the browser bar, e.g. https://annotation.niulab.online (set it in .env).
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3106,http://127.0.0.1:3106}
      # Keep 1 behind HTTPS. Set 0 in .env only for plain-HTTP access, where browsers discard Secure cookies.
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      SOURCE_WORKBOOK: /input/study.xlsx
    volumes:
      - annotation-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3106:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  annotation-data:

